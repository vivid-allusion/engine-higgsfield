id = "higgsfield-cinema-studio-4-0"
label = "Cinema Studio 4.0 — Generate API"
category = "IMG"
platform = "higgsfield"
endpoint = "higgsfield/higgsfield-cinema-studio-4-0"
api_path = "/higgsfield/cinema-studio/4.0"
description = "Cinema Studio 4.0 — Generate API"

[pricing]
note = "unset — take the price from the provider's own page before shipping"

[general]
kind = "image"
prompt = "required"
duration_param_name = "duration"

[params.era]
label = "Era"
type = "select"
default = "1960s"
options = [
  { value = "1960s", label = "1960s" },
  { value = "1980s", label = "1980s" },
  { value = "1990s", label = "1990s" },
  { value = "2000s", label = "2000s" },
  { value = "2020s", label = "2020s" },
]

[params.genre]
label = "Genre"
type = "select"
default = "epic"
options = [
  { value = "epic", label = "epic" },
  { value = "drama", label = "drama" },
  { value = "noir", label = "noir" },
  { value = "comedy", label = "comedy" },
  { value = "horror", label = "horror" },
  { value = "action", label = "action" },
]

