id = "z-image-turbo"
label = "Z-Image Turbo — Generate API"
category = "IMG"
platform = "higgsfield"
endpoint = "higgsfield/z-image-turbo"
api_path = "/z-image/turbo"
description = "Z-Image Turbo — Generate API"

[pricing]
note = "unset — take the price from the provider's own page before shipping"

[general]
kind = "image"
prompt = "required"

[params.seed]
label = "Seed"
type = "integer"
min = 0
max = 2147483647

[params.resolution]
label = "Resolution"
type = "select"
default = "1k"
options = [
  { value = "1k", label = "1k" },
  { value = "2k", label = "2k" },
]

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "1:1"
options = [
  { value = "1:1", label = "1:1" },
  { value = "2:3", label = "2:3" },
  { value = "3:2", label = "3:2" },
  { value = "3:4", label = "3:4" },
  { value = "4:3", label = "4:3" },
  { value = "7:9", label = "7:9" },
  { value = "9:7", label = "9:7" },
  { value = "9:16", label = "9:16" },
  { value = "16:9", label = "16:9" },
  { value = "21:9", label = "21:9" },
]

[params.prompt_extend]
label = "Prompt Extend"
type = "boolean"
default = false
