category = "IMG"
platform = "higgsfield"
endpoint = "higgsfield/xai-grok-imagine-image-2-0"
api_path = "/xai/grok-imagine-image-2.0"
description = "Grok Image 2.0 — Generate and edit API"

[pricing]
note = "unset — take the price from the provider's own page before shipping"

[general]
kind = "image"
prompt = "required"

[params.quality]
label = "Quality"
type = "select"
default = "medium"
options = [
  { value = "low", label = "low" },
  { value = "medium", label = "medium" },
]

