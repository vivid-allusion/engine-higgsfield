  { value = "1:1", label = "1:1" },
  { value = "1:2", label = "1:2" },
  { value = "2:1", label = "2:1" },
  { value = "3:2", label = "3:2" },
  { value = "2:3", label = "2:3" },
  { value = "4:3", label = "4:3" },
  { value = "3:4", label = "3:4" },
  { value = "16:9", label = "16:9" },
  { value = "9:16", label = "9:16" },
]
