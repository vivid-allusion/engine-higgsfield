id = "higgsfield-ai-soul-v2-standard"
label = "SOUL V2 — Text to image API"
category = "IMG"
platform = "higgsfield"
endpoint = "higgsfield/higgsfield-ai-soul-v2-standard"
api_path = "/higgsfield-ai/soul/v2/standard"
description = "SOUL V2 — Text to image API"

[pricing]
note = "unset — take the price from the provider's own page before shipping"

[general]
kind = "image"
prompt = "required"

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "1:1"
options = [
  { value = "9:16", label = "9:16" },
  { value = "16:9", label = "16:9" },
  { value = "4:3", label = "4:3" },
  { value = "3:4", label = "3:4" },
  { value = "1:1", label = "1:1" },
  { value = "2:3", label = "2:3" },
  { value = "3:2", label = "3:2" },
]

[params.resolution]
label = "Resolution"
type = "select"
default = "720p"
options = [
  { value = "720p", label = "720p" },
  { value = "1080p", label = "1080p" },
]

[params.enhance_prompt]
label = "Enhance Prompt"
type = "boolean"
default = false

[params.custom_reference_id]
label = "Custom Reference Id"
type = "text"

[params.custom_reference_strength]
label = "Custom Reference Strength"
type = "number"
default = 1.0
min = 0
max = 1

[params.style_id]
label = "Style Id"
type = "text"
default = "3db34ab5-3439-4317-9e03-08dc30852e69"

[params.style_strength]
label = "Style Strength"
type = "number"
default = 1.0
min = 0
max = 1

[params.seed]
label = "Seed"
type = "integer"
min = 1
max = 1000000

[params.batch_size]
label = "Batch Size"
type = "integer"
default = 1
min = 1
max = 4
