id = "minimax-h3-reference-to-video"
label = "MiniMax H3 — Reference to video API"
category = "VID"
platform = "higgsfield"
endpoint = "higgsfield/minimax-h3-reference-to-video"
api_path = "/minimax/h3/reference-to-video"
description = "MiniMax H3 — Reference to video API"

[pricing]
note = "unset — take the price from the provider's own page before shipping"

[general]
kind = "video"
prompt = "required"
duration_param_name = "duration"

[params.duration]
label = "Duration"
type = "integer"
default = 5
min = 5
max = 15

[params.resolution]
label = "Resolution"
type = "select"
default = "2K"
options = [
  { value = "2K", label = "2K" },
]

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "auto"
options = [
  { value = "auto", label = "auto" },
  { value = "adaptive", label = "adaptive" },
  { value = "21:9", label = "21:9" },
  { value = "16:9", label = "16:9" },
  { value = "4:3", label = "4:3" },
  { value = "1:1", label = "1:1" },
  { value = "3:4", label = "3:4" },
  { value = "9:16", label = "9:16" },
]

[params.aigc_watermark]
label = "Aigc Watermark"
type = "boolean"
default = false
