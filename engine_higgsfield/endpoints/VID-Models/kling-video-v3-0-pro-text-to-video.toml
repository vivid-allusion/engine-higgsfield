id = "kling-video-v3-0-pro-text-to-video"
label = "Kling 3.0 — Pro · Text to video API"
category = "VID"
platform = "higgsfield"
endpoint = "higgsfield/kling-video-v3-0-pro-text-to-video"
api_path = "/kling-video/v3.0/pro/text-to-video"
description = "Kling 3.0 — Pro · Text to video API"

[pricing]
note = "unset — take the price from the provider's own page before shipping"

[general]
kind = "video"
prompt = "required"
duration_param_name = "duration"

[params.sound]
label = "Sound"
type = "select"
default = "on"
options = [
  { value = "on", label = "on" },
  { value = "off", label = "off" },
]

[params.duration]
label = "Duration"
type = "integer"
default = 5
min = 3
max = 15

[params.cfg_scale]
label = "Cfg Scale"
type = "number"
default = 0.5
min = 0
max = 1

[params.multi_shots]
label = "Multi Shots"
type = "boolean"
default = false

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
options = [
  { value = "16:9", label = "16:9" },
  { value = "9:16", label = "9:16" },
  { value = "1:1", label = "1:1" },
]
