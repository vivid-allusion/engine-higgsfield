id = "alibaba-happy-horse-v1-1-text-to-video"
label = "HappyHorse 1.1 — Text to video API"
category = "VID"
platform = "higgsfield"
endpoint = "higgsfield/alibaba-happy-horse-v1-1-text-to-video"
api_path = "/alibaba/happy-horse/v1.1/text-to-video"
description = "HappyHorse 1.1 — Text to video API"

[pricing]
note = "unset — take the price from the provider's own page before shipping"

[general]
kind = "video"
prompt = "required"
duration_param_name = "duration"

[params.seed]
label = "Seed"
type = "integer"
min = 1
max = 2147483646

[params.duration]
label = "Duration"
type = "integer"
default = 5
min = 3
max = 15

[params.resolution]
label = "Resolution"
type = "select"
default = "1080p"
options = [
  { value = "720p", label = "720p" },
  { value = "1080p", label = "1080p" },
]

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
options = [
  { value = "16:9", label = "16:9" },
  { value = "9:16", label = "9:16" },
  { value = "1:1", label = "1:1" },
  { value = "4:3", label = "4:3" },
  { value = "3:4", label = "3:4" },
]
