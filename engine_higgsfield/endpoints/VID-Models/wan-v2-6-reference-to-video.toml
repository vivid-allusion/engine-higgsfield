id = "wan-v2-6-reference-to-video"
label = "Wan 2.6 — Reference to video API"
category = "VID"
platform = "higgsfield"
endpoint = "higgsfield/wan-v2-6-reference-to-video"
api_path = "/wan/v2.6/reference-to-video"
description = "Wan 2.6 — Reference to video API"

[pricing]
note = "unset — take the price from the provider's own page before shipping"

[general]
kind = "video"
prompt = "required"
duration_param_name = "duration"

[params.duration]
label = "Duration"
type = "select"
default = "5"
options = [
  { value = "5", label = "5" },
  { value = "10", label = "10" },
]

[params.resolution]
label = "Resolution"
type = "select"
default = "720p"
options = [
  { value = "720p", label = "720p" },
  { value = "1080p", label = "1080p" },
]

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
options = [
  { value = "16:9", label = "16:9" },
  { value = "9:16", label = "9:16" },
  { value = "1:1", label = "1:1" },
  { value = "4:3", label = "4:3" },
  { value = "3:4", label = "3:4" },
]
