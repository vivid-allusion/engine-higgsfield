id = "kling-video-omni-video-reference"
label = "Kling Omni — Video reference API"
category = "VID"
platform = "higgsfield"
endpoint = "higgsfield/kling-video-omni-video-reference"
api_path = "/kling-video/omni/video-reference"
description = "Kling Omni — Video reference API"

[pricing]
note = "unset — take the price from the provider's own page before shipping"

[general]
kind = "video"
prompt = "required"
duration_param_name = "duration"

[params.mode]
label = "Mode"
type = "select"
default = "pro"
options = [
  { value = "std", label = "std" },
  { value = "pro", label = "pro" },
]

[params.duration]
label = "Duration"
type = "integer"
default = 5
min = 3
max = 10

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
options = [
  { value = "16:9", label = "16:9" },
  { value = "9:16", label = "9:16" },
  { value = "1:1", label = "1:1" },
]
