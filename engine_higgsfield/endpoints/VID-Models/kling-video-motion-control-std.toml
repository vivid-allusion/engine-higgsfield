id = "kling-video-motion-control-std"
label = "Kling 2.6 Motion Control — Standard API"
category = "VID"
platform = "higgsfield"
endpoint = "higgsfield/kling-video-motion-control-std"
api_path = "/kling-video/motion-control/std"
description = "Kling 2.6 Motion Control — Standard API"

[pricing]
note = "unset — take the price from the provider's own page before shipping"

[general]
kind = "video"
prompt = "required"
image_url_param = "image_url"
slots = ["video_url"]

[params.keep_original_sound]
label = "Keep Original Sound"
type = "select"
default = "yes"
options = [
  { value = "yes", label = "yes" },
  { value = "no", label = "no" },
]

[params.character_orientation]
label = "Character Orientation"
type = "select"
default = "video"
options = [
  { value = "image", label = "image" },
  { value = "video", label = "video" },
]
