id = "alibaba-wan-3-0-image-to-video"
label = "Wan 3.0 — Image to video API"
category = "VID"
platform = "higgsfield"
endpoint = "higgsfield/alibaba-wan-3-0-image-to-video"
api_path = "/alibaba/wan-3.0/image-to-video"
description = "Wan 3.0 — Image to video API"

[pricing]
note = "unset — take the price from the provider's own page before shipping"

[general]
kind = "video"
prompt = "required"
image_url_param = "image_url"
slots = ["end_image_url"]
duration_param_name = "duration"

[params.seed]
label = "Seed"
type = "integer"
min = 0
max = 2147483647

[params.duration]
label = "Duration"
type = "integer"
default = 5
min = 2
max = 30

[params.resolution]
label = "Resolution"
type = "select"
default = "1080p"
options = [
  { value = "480p", label = "480p" },
  { value = "720p", label = "720p" },
  { value = "1080p", label = "1080p" },
]

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "adaptive"
options = [
  { value = "16:9", label = "16:9" },
  { value = "4:3", label = "4:3" },
  { value = "1:1", label = "1:1" },
  { value = "3:4", label = "3:4" },
  { value = "9:16", label = "9:16" },
  { value = "adaptive", label = "adaptive" },
]

[params.generate_audio]
label = "Generate Audio"
type = "boolean"
default = true

[params.enable_thinking]
label = "Enable Thinking"
type = "boolean"
default = false
