id = "kling-video-v2-6-pro-text-to-video"
label = "Kling 2.6 — Pro text to video API"
category = "VID"
platform = "higgsfield"
endpoint = "higgsfield/kling-video-v2-6-pro-text-to-video"
api_path = "/kling-video/v2.6/pro/text-to-video"
description = "Kling 2.6 — Pro text to video API"

[pricing]
note = "unset — take the price from the provider's own page before shipping"

[general]
kind = "video"
prompt = "required"
duration_param_name = "duration"

[params.sound]
label = "Sound"
type = "select"
default = "on"
options = [
  { value = "on", label = "on" },
  { value = "off", label = "off" },
]

[params.duration]
label = "Duration"
type = "select"
default = "5"
options = [
  { value = "5", label = "5" },
  { value = "10", label = "10" },
]

[params.cfg_scale]
label = "Cfg Scale"
type = "number"
default = 0.5
min = 0
max = 1

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
options = [
  { value = "16:9", label = "16:9" },
  { value = "9:16", label = "9:16" },
  { value = "1:1", label = "1:1" },
]
