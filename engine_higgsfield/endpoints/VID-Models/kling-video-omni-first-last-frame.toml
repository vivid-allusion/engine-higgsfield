id = "kling-video-omni-first-last-frame"
label = "Kling Omni — First last frame API"
category = "VID"
platform = "higgsfield"
endpoint = "higgsfield/kling-video-omni-first-last-frame"
api_path = "/kling-video/omni/first-last-frame"
description = "Kling Omni — First last frame API"

[pricing]
note = "unset — take the price from the provider's own page before shipping"

[general]
kind = "video"
prompt = "required"
image_url_param = "last_frame_url"
slots = ["first_frame_url"]
duration_param_name = "duration"

[params.mode]
label = "Mode"
type = "select"
default = "pro"
options = [
  { value = "std", label = "std" },
  { value = "pro", label = "pro" },
]

[params.duration]
label = "Duration"
type = "select"
default = "5"
options = [
  { value = "5", label = "5" },
  { value = "10", label = "10" },
]

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
options = [
  { value = "16:9", label = "16:9" },
  { value = "9:16", label = "9:16" },
  { value = "1:1", label = "1:1" },
]
