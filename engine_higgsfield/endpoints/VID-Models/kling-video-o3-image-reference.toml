id = "kling-video-o3-image-reference"
label = "Kling O3 — Image reference API"
category = "VID"
platform = "higgsfield"
endpoint = "higgsfield/kling-video-o3-image-reference"
api_path = "/kling-video/o3/image-reference"
description = "Kling O3 — Image reference API"

[pricing]
note = "unset — take the price from the provider's own page before shipping"

[general]
kind = "video"
prompt = "required"
image_url_param = "last_frame_url"
slots = ["first_frame_url"]
duration_param_name = "duration"

[params.mode]
label = "Mode"
type = "select"
default = "std"
options = [
  { value = "std", label = "std" },
  { value = "pro", label = "pro" },
  { value = "4k", label = "4k" },
]

[params.sound]
label = "Sound"
type = "select"
default = "off"
options = [
  { value = "on", label = "on" },
  { value = "off", label = "off" },
]

[params.duration]
label = "Duration"
type = "integer"
default = 5
min = 3
max = 15

[params.shot_type]
label = "Shot Type"
type = "select"
default = "customize"
options = [
  { value = "customize", label = "customize" },
  { value = "intelligent", label = "intelligent" },
]

[params.multi_shots]
label = "Multi Shots"
type = "boolean"
default = false

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
options = [
  { value = "16:9", label = "16:9" },
  { value = "9:16", label = "9:16" },
  { value = "1:1", label = "1:1" },
]
