id = "kling-video-v3-0-4k-image-to-video"
label = "Kling 3.0 — 4K · Image to video API"
category = "VID"
platform = "higgsfield"
endpoint = "higgsfield/kling-video-v3-0-4k-image-to-video"
api_path = "/kling-video/v3.0/4k/image-to-video"
description = "Kling 3.0 — 4K · Image to video API"

[pricing]
note = "unset — take the price from the provider's own page before shipping"

[general]
kind = "video"
prompt = "required"
image_url_param = "image_url"
slots = ["last_image_url"]
duration_param_name = "duration"

[params.sound]
label = "Sound"
type = "select"
default = "on"
options = [
  { value = "on", label = "on" },
  { value = "off", label = "off" },
]

[params.duration]
label = "Duration"
type = "integer"
default = 5
min = 3
max = 15

[params.cfg_scale]
label = "Cfg Scale"
type = "number"
default = 0.5
min = 0
max = 1

[params.multi_shots]
label = "Multi Shots"
type = "boolean"
default = false
