  { value = "5", label = "5" },
  { value = "10", label = "10" },
]

[params.cfg_scale]
label = "Cfg Scale"
type = "number"
default = 0.5
min = 0
max = 1

[params.negative_prompt]
label = "Negative Prompt"
type = "text"
